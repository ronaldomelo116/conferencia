<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferência de Estoque</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <link rel="icon" type="img/png" href="favicon.png">
    <link rel="shortcut icon" type="img/png" href="img/favicon.png">
    <style>
        body {
            background-color: #F37021; 
            color: #e8eaed;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #202124;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h2 {
            color: #fff;
            border-bottom: 1px solid #5f6368;
            padding-bottom: 10px;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .painel-contagem {
            background-color: #303134;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
            border: 2px solid #8ab4f8;
            color: #fff;
        }
        .painel-contagem span {
            color: #8ab4f8;
            font-weight: bold;
            font-size: 24px;
        }
        .upload-section {
            background-color: #303134;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #5f6368;
        }
        .upload-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        input[type="file"] {
            color: #8ab4f8;
            font-size: 16px;
        }
        .btn-limpar {
            background-color: #c5221f;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-limpar:hover {
            background-color: #a51b19;
        }
        .btn-limpar:disabled {
            background-color: #5f6368;
            color: #9aa0a6;
            cursor: not-allowed;
        }
        .search-bar {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            background-color: #171717;
            border: 2px solid #8ab4f8;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .search-bar:focus {
            border-color: #aecbfa;
            box-shadow: 0 0 8px rgba(138, 180, 248, 0.5);
        }
        
        /* Caixas de Alerta */
        #alert-box {
            display: none;
            background-color: #fce8e6;
            color: #c5221f;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #c5221f;
        }
        /* Novo Alerta Amarelo para Item Duplicado */
        #alert-warning {
            display: none;
            background-color: #fef7e0;
            color: #b06000;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #fbbc04;
        }

        .tabela-container {
            background-color: #303134;
            border-radius: 8px;
            border: 1px solid #5f6368;
            overflow: hidden;
        }
        .list-header {
            display: flex;
            background-color: #171717;
            padding: 15px;
            border-bottom: 2px solid #5f6368;
            font-size: 12px;
            font-weight: bold;
            color: #9aa0a6;
            text-transform: uppercase;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 600px;
            overflow-y: auto;
        }
        li {
            padding: 12px 15px;
            border-bottom: 1px solid #5f6368;
            font-size: 14px;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }
        li:last-child {
            border-bottom: none;
        }
        .grid-row {
            flex: 1;
            display: grid;
            grid-template-columns: 0.8fr 0.8fr 4fr 1.5fr 1.5fr 1fr 0.5fr 1fr;
            gap: 15px;
            align-items: center;
            padding-right: 15px;
        }
        .col-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .col-ns {
            color: #8ab4f8;
            font-weight: bold;
        }

        .destaque-busca {
            background-color: #444746 !important;
            border-left: 8px solid #fbbc04;
        }
        .verificado {
            background-color: #137333 !important;
            color: #fff;
            border-left: 8px solid #137333;
        }
        .verificado .col-text, .verificado .col-ns {
            color: #fff !important;
        }
        
        /* NOVO: Animação de Piscar Amarelo para Item Já Verificado */
        @keyframes piscarAmarelo {
            0% { background-color: #137333; border-left-color: #137333; }
            50% { background-color: #b06000; border-left-color: #fbbc04; }
            100% { background-color: #137333; border-left-color: #137333; }
        }
        .piscar-aviso {
            animation: piscarAmarelo 0.8s infinite !important;
        }

        .status-container {
            width: 80px;
            text-align: right;
        }
        .status-badge {
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 4px;
            background-color: #5f6368;
            font-weight: bold;
            white-space: nowrap;
            display: inline-block;
        }
        .verificado .status-badge {
            background-color: #ceead6;
            color: #137333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        Conferência de Transação
        <div class="painel-contagem">
            Bipados: <span id="qtdBipados">0</span> / <span id="qtdTotal">0</span>
        </div>
    </h2>
    
    <div class="upload-section">
        <label for="txtFile">1. Envie o arquivo (.txt ou .csv):</label>
        <div class="upload-controls">
            <input type="file" id="txtFile" accept=".txt, .csv">
            <button id="btnLimpar" class="btn-limpar" disabled>🗑️ Limpar Lista</button>
        </div>
    </div>

    <input type="text" id="searchBar" class="search-bar" placeholder="Bipe ou digite os últimos números..." disabled autocomplete="off">

    <div id="alert-box">❌ ALERTA: Equipamento não encontrado na lista!</div>
    <div id="alert-warning">⚠️ ATENÇÃO: Item Verificado (Este equipamento já foi bipado).</div>

    <div class="tabela-container">
        <div class="list-header" id="listHeader" style="display: none;">
            <div class="grid-row">
                <div>Código</div>
                <div>Data</div>
                <div>Nome</div>
                <div>Número de Série</div>
                <div>NS Interno</div>
                <div>Estado</div>
                <div>Qtd</div>
                <div>Funcionário</div>
            </div>
            <div class="status-container">Status</div>
        </div>

        <ul id="nsList">
            <li id="mensagemVazia" style="color: #9aa0a6; text-align: center; justify-content: center;">
                Os itens da transação aparecerão aqui organizados em colunas.
            </li>
        </ul>
    </div>
</div>

<script>
    const fileInput = document.getElementById('txtFile');
    const btnLimpar = document.getElementById('btnLimpar');
    const searchBar = document.getElementById('searchBar');
    const nsList = document.getElementById('nsList');
    const listHeader = document.getElementById('listHeader');
    const alertBox = document.getElementById('alert-box');
    const alertWarning = document.getElementById('alert-warning');
    const spanBipados = document.getElementById('qtdBipados');
    const spanTotal = document.getElementById('qtdTotal');

    let totalItens = 0;
    let itensBipados = 0;
    let typingTimer;
    const tempoDeEspera = 150; 

    btnLimpar.addEventListener('click', function() {
        nsList.innerHTML = '<li id="mensagemVazia" style="color: #9aa0a6; text-align: center; justify-content: center;">Os itens da transação aparecerão aqui organizados em colunas.</li>';
        listHeader.style.display = 'none'; 
        
        totalItens = 0;
        itensBipados = 0;
        spanTotal.textContent = totalItens;
        spanBipados.textContent = itensBipados;
        spanBipados.style.color = '#8ab4f8'; 
        
        fileInput.value = '';
        searchBar.value = '';
        searchBar.disabled = true;
        btnLimpar.disabled = true;
        alertBox.style.display = 'none';
        alertWarning.style.display = 'none';
    });

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            let linhas = content.split(/\r?\n/).filter(line => line.trim() !== '');
            
            if (linhas.length > 0 && linhas[0].toLowerCase().includes('código')) {
                linhas.shift();
            }

            renderList(linhas);
            btnLimpar.disabled = false;
        };
        reader.readAsText(file);
    });

    function renderList(linhas) {
        nsList.innerHTML = ''; 
        listHeader.style.display = 'flex'; 
        
        totalItens = linhas.length;
        itensBipados = 0;
        spanTotal.textContent = totalItens;
        spanBipados.textContent = itensBipados;
        spanBipados.style.color = '#8ab4f8'; 

        linhas.forEach(linha => {
            const textoOriginal = linha.trim();
            let limpo = textoOriginal.replace(/"/g, ''); 
            
            let separador = '\t';
            if (limpo.includes('\t')) separador = '\t';
            else if (limpo.includes(';')) separador = ';';
            else if (limpo.includes(',')) separador = ',';

            let colunas = limpo.split(separador);

            let colsHTML = '';
            for(let i = 0; i < 8; i++) {
                let valor = colunas[i] ? colunas[i].trim() : '-';
                
                if(i === 3) {
                    colsHTML += `<div class="col-text col-ns" title="${valor}">${valor}</div>`;
                } else {
                    colsHTML += `<div class="col-text" title="${valor}">${valor}</div>`;
                }
            }

            const li = document.createElement('li');
            li.dataset.linhaRaw = textoOriginal.toUpperCase(); 
            
            li.innerHTML = `
                <div class="grid-row">
                    ${colsHTML}
                </div>
                <div class="status-container">
                    <span class="status-badge">Pendente</span>
                </div>
            `;
            nsList.appendChild(li);
        });

        searchBar.disabled = false;
        searchBar.focus();
    }

    searchBar.addEventListener('input', function() {
        clearTimeout(typingTimer); 
        const termo = this.value.trim().toUpperCase();
        const items = nsList.querySelectorAll('li');
        
        // Remove os efeitos visuais anteriores assim que o usuário digita/apaga algo
        items.forEach(li => {
            li.classList.remove('destaque-busca');
            li.classList.remove('piscar-aviso');
        });

        // Esconde as caixas de erro e aviso
        alertBox.style.display = 'none';
        alertWarning.style.display = 'none';

        if (!termo) return;

        let pendentes = [];
        let jaVerificados = [];

        items.forEach(li => {
            if (li.dataset.linhaRaw.includes(termo)) {
                if (!li.classList.contains('verificado')) {
                    pendentes.push(li);
                    li.classList.add('destaque-busca'); 
                } else {
                    jaVerificados.push(li);
                }
            }
        });

        // Rola a tela para o item correspondente
        if (pendentes.length > 0) {
            pendentes[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (jaVerificados.length > 0) {
            jaVerificados[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        typingTimer = setTimeout(() => {
            // Se achou um item pendente
            if (pendentes.length === 1 && termo.length >= 4) {
                confirmarItem(pendentes[0]);
            } 
            // Se NÃO achou pendentes, mas achou UM que já foi verificado
            else if (pendentes.length === 0 && jaVerificados.length === 1 && termo.length >= 4) {
                dispararAvisoVerificado(jaVerificados[0]);
            }
            // Se o leitor parou e não achou nada em lugar nenhum
            else if (pendentes.length === 0 && jaVerificados.length === 0 && termo.length > 5) {
                dispararErro();
            }
        }, tempoDeEspera);
    });

    searchBar.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            clearTimeout(typingTimer);
            const termo = this.value.trim().toUpperCase();
            if (!termo) return;

            const items = nsList.querySelectorAll('li');
            let matchPendente = null;
            let matchVerificado = null;

            items.forEach(li => {
                if (li.dataset.linhaRaw.includes(termo)) {
                    if (!li.classList.contains('verificado')) {
                        if (!matchPendente) matchPendente = li; 
                    } else {
                        if (!matchVerificado) matchVerificado = li;
                    }
                }
            });

            if (matchPendente) confirmarItem(matchPendente);
            else if (matchVerificado) dispararAvisoVerificado(matchVerificado);
            else dispararErro();
        }
    });

    function confirmarItem(li) {
        li.classList.remove('destaque-busca');
        li.classList.add('verificado');
        li.querySelector('.status-badge').textContent = 'OK';
        
        itensBipados++;
        spanBipados.textContent = itensBipados;
        
        if (itensBipados === totalItens) {
            spanBipados.style.color = '#137333';
        }
        
        searchBar.value = '';
        searchBar.focus();
    }

    function dispararAvisoVerificado(li) {
        li.classList.add('piscar-aviso');
        li.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        alertWarning.style.display = 'block';
        
        // Toca um som de aviso
        let audio = new Audio('https://www.soundjay.com/buttons/sounds/beep-07a.mp3');
        audio.play().catch(() => {}); 
        
        // Mantém o texto na barra, mas SELECIONA ele inteiro. 
        // Assim o pisca-pisca continua até você apagar, ou caso você bipe o próximo item, 
        // o leitor substituirá o texto atual sozinho!
        searchBar.select();
    }

    function dispararErro() {
        alertBox.style.display = 'block';
        let audio = new Audio('https://www.soundjay.com/buttons/sounds/beep-07a.mp3');
        audio.play().catch(() => {}); 
        
        setTimeout(() => {
            alertBox.style.display = 'none';
        }, 3000);
        
        searchBar.value = '';
        searchBar.focus();
    }
</script>

</body>
</html>
