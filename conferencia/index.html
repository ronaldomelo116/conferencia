<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferência de Estoque</title>
    <style>
        body {
            background-color: #F37021; 
            color: #e8eaed;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        /* Aumentei a largura para caberem todas as colunas com conforto */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #202124;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        h2 {
            color: #fff;
            border-bottom: 1px solid #5f6368;
            padding-bottom: 10px;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .painel-contagem {
            background-color: #303134;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
            border: 2px solid #8ab4f8;
            color: #fff;
        }
        .painel-contagem span {
            color: #8ab4f8;
            font-weight: bold;
            font-size: 24px;
        }
        .upload-section {
            background-color: #303134;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #5f6368;
        }
        .upload-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        input[type="file"] {
            color: #8ab4f8;
            font-size: 16px;
        }
        .btn-limpar {
            background-color: #c5221f;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-limpar:hover {
            background-color: #a51b19;
        }
        .btn-limpar:disabled {
            background-color: #5f6368;
            color: #9aa0a6;
            cursor: not-allowed;
        }
        .search-bar {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            background-color: #171717;
            border: 2px solid #8ab4f8;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .search-bar:focus {
            border-color: #aecbfa;
            box-shadow: 0 0 8px rgba(138, 180, 248, 0.5);
        }
        #alert-box {
            display: none;
            background-color: #fce8e6;
            color: #c5221f;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #c5221f;
        }

        /* ----- NOVO ESTILO DA TABELA (CABEÇALHO E LINHAS) ----- */
        .tabela-container {
            background-color: #303134;
            border-radius: 8px;
            border: 1px solid #5f6368;
            overflow: hidden;
        }
        .list-header {
            display: flex;
            background-color: #171717;
            padding: 15px;
            border-bottom: 2px solid #5f6368;
            font-size: 12px;
            font-weight: bold;
            color: #9aa0a6;
            text-transform: uppercase;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 600px;
            overflow-y: auto;
        }
        li {
            padding: 12px 15px;
            border-bottom: 1px solid #5f6368;
            font-size: 14px;
            display: flex;
            align-items: center;
            transition: all 0.2s ease;
        }
        li:last-child {
            border-bottom: none;
        }
        /* Grid inteligente para organizar as colunas de forma alinhada */
        .grid-row {
            flex: 1;
            display: grid;
            /* Proporções exatas baseadas na sua imagem */
            grid-template-columns: 0.8fr 0.8fr 4fr 1.5fr 1.5fr 1fr 0.5fr 1fr;
            gap: 15px;
            align-items: center;
            padding-right: 15px;
        }
        .col-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Destaque do Número de Série */
        .col-ns {
            color: #8ab4f8;
            font-weight: bold;
        }

        /* Efeitos visuais do Ctrl+F */
        .destaque-busca {
            background-color: #444746 !important;
            border-left: 8px solid #fbbc04;
        }
        .verificado {
            background-color: #137333 !important;
            color: #fff;
            border-left: 8px solid #137333;
        }
        .verificado .col-text, .verificado .col-ns {
            color: #fff !important;
        }
        
        .status-container {
            width: 80px;
            text-align: right;
        }
        .status-badge {
            font-size: 13px;
            padding: 6px 10px;
            border-radius: 4px;
            background-color: #5f6368;
            font-weight: bold;
            white-space: nowrap;
            display: inline-block;
        }
        .verificado .status-badge {
            background-color: #ceead6;
            color: #137333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        Conferência de Transação
        <div class="painel-contagem">
            Bipados: <span id="qtdBipados">0</span> / <span id="qtdTotal">0</span>
        </div>
    </h2>
    
    <div class="upload-section">
        <label for="txtFile">1. Envie o arquivo (.txt ou .csv):</label>
        <div class="upload-controls">
            <input type="file" id="txtFile" accept=".txt, .csv">
            <button id="btnLimpar" class="btn-limpar" disabled>🗑️ Limpar Lista</button>
        </div>
    </div>

    <input type="text" id="searchBar" class="search-bar" placeholder="Bipe ou digite os últimos números..." disabled autocomplete="off">

    <div id="alert-box">❌ ALERTA: Equipamento não encontrado na lista!</div>

    <div class="tabela-container">
        <div class="list-header" id="listHeader" style="display: none;">
            <div class="grid-row">
                <div>Código</div>
                <div>Data</div>
                <div>Nome</div>
                <div>Número de Série</div>
                <div>NS Interno</div>
                <div>Estado</div>
                <div>Qtd</div>
                <div>Funcionário</div>
            </div>
            <div class="status-container">Status</div>
        </div>

        <ul id="nsList">
            <li id="mensagemVazia" style="color: #9aa0a6; text-align: center; justify-content: center;">
                Os itens da transação aparecerão aqui organizados em colunas.
            </li>
        </ul>
    </div>
</div>

<script>
    const fileInput = document.getElementById('txtFile');
    const btnLimpar = document.getElementById('btnLimpar');
    const searchBar = document.getElementById('searchBar');
    const nsList = document.getElementById('nsList');
    const listHeader = document.getElementById('listHeader');
    const alertBox = document.getElementById('alert-box');
    const spanBipados = document.getElementById('qtdBipados');
    const spanTotal = document.getElementById('qtdTotal');

    let totalItens = 0;
    let itensBipados = 0;
    let typingTimer;
    const tempoDeEspera = 150; 

    // ---- FUNÇÃO PARA LIMPAR TUDO ----
    btnLimpar.addEventListener('click', function() {
        nsList.innerHTML = '<li id="mensagemVazia" style="color: #9aa0a6; text-align: center; justify-content: center;">Os itens da transação aparecerão aqui organizados em colunas.</li>';
        listHeader.style.display = 'none'; // Esconde o cabeçalho
        
        totalItens = 0;
        itensBipados = 0;
        spanTotal.textContent = totalItens;
        spanBipados.textContent = itensBipados;
        spanBipados.style.color = '#8ab4f8'; 
        
        fileInput.value = '';
        searchBar.value = '';
        searchBar.disabled = true;
        btnLimpar.disabled = true;
    });

    // ---- FUNÇÃO DE UPLOAD ----
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            // Filtra as linhas vazias
            let linhas = content.split(/\r?\n/).filter(line => line.trim() !== '');
            
            // Remove a primeira linha se ela for o cabeçalho (para não duplicar)
            if (linhas.length > 0 && linhas[0].toLowerCase().includes('código')) {
                linhas.shift();
            }

            renderList(linhas);
            btnLimpar.disabled = false;
        };
        reader.readAsText(file);
    });

    // ---- FUNÇÃO DE RENDERIZAR TABELA ----
    function renderList(linhas) {
        nsList.innerHTML = ''; 
        listHeader.style.display = 'flex'; // Mostra o cabeçalho
        
        totalItens = linhas.length;
        itensBipados = 0;
        spanTotal.textContent = totalItens;
        spanBipados.textContent = itensBipados;
        spanBipados.style.color = '#8ab4f8'; 

        linhas.forEach(linha => {
            const textoOriginal = linha.trim();
            // Limpa aspas do CSV
            let limpo = textoOriginal.replace(/"/g, ''); 
            
            // Descobre qual é o separador do arquivo (Tab, Ponto e vírgula, ou Vírgula)
            let separador = '\t';
            if (limpo.includes('\t')) separador = '\t';
            else if (limpo.includes(';')) separador = ';';
            else if (limpo.includes(',')) separador = ',';

            // Quebra a linha nas colunas
            let colunas = limpo.split(separador);

            // Monta o HTML das colunas dentro do grid (Até 8 colunas)
            let colsHTML = '';
            for(let i = 0; i < 8; i++) {
                let valor = colunas[i] ? colunas[i].trim() : '-';
                
                // Destaca a coluna 3 (Número de Série) em azul
                if(i === 3) {
                    colsHTML += `<div class="col-text col-ns" title="${valor}">${valor}</div>`;
                } else {
                    colsHTML += `<div class="col-text" title="${valor}">${valor}</div>`;
                }
            }

            const li = document.createElement('li');
            li.dataset.linhaRaw = textoOriginal.toUpperCase(); 
            
            li.innerHTML = `
                <div class="grid-row">
                    ${colsHTML}
                </div>
                <div class="status-container">
                    <span class="status-badge">Pendente</span>
                </div>
            `;
            nsList.appendChild(li);
        });

        searchBar.disabled = false;
        searchBar.focus();
    }

    // ---- LÓGICA DE BUSCA (BIPADOR) ----
    searchBar.addEventListener('input', function() {
        clearTimeout(typingTimer); 
        const termo = this.value.trim().toUpperCase();
        const items = nsList.querySelectorAll('li');
        
        items.forEach(li => li.classList.remove('destaque-busca'));

        if (!termo) return;

        let matches = [];

        items.forEach(li => {
            if (!li.classList.contains('verificado') && li.dataset.linhaRaw.includes(termo)) {
                matches.push(li);
                li.classList.add('destaque-busca'); 
            }
        });

        if (matches.length > 0) {
            matches[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        typingTimer = setTimeout(() => {
            if (matches.length === 1 && termo.length >= 4) {
                confirmarItem(matches[0]);
            } 
            else if (matches.length === 0 && termo.length > 5) {
                dispararErro();
            }
        }, tempoDeEspera);
    });

    searchBar.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            clearTimeout(typingTimer);
            const termo = this.value.trim().toUpperCase();
            if (!termo) return;

            const items = nsList.querySelectorAll('li');
            let matchEncontrado = null;

            items.forEach(li => {
                if (!li.classList.contains('verificado') && li.dataset.linhaRaw.includes(termo)) {
                    if (!matchEncontrado) matchEncontrado = li; 
                }
            });

            if (matchEncontrado) confirmarItem(matchEncontrado);
            else dispararErro();
        }
    });

    function confirmarItem(li) {
        li.classList.remove('destaque-busca');
        li.classList.add('verificado');
        li.querySelector('.status-badge').textContent = 'OK';
        
        itensBipados++;
        spanBipados.textContent = itensBipados;
        
        if (itensBipados === totalItens) {
            spanBipados.style.color = '#137333';
        }
        
        searchBar.value = '';
        searchBar.focus();
    }

    function dispararErro() {
        alertBox.style.display = 'block';
        let audio = new Audio('https://www.soundjay.com/buttons/sounds/beep-07a.mp3');
        audio.play().catch(() => {}); 
        
        setTimeout(() => {
            alertBox.style.display = 'none';
        }, 3000);
        
        searchBar.value = '';
        searchBar.focus();
    }
</script>

</body>
</html>
