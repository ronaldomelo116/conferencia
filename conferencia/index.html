<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EstoqueTools - Início</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="shortcut icon" type="image/png" href="img/favicon.png">

    <style>
        /* --- VARIÁVEIS DE TEMA --- */
        :root {
            --bg-container: #202124;
            --text-main: #e8eaed;
            --border-color: #5f6368;
            --btn-theme-bg: #303134;
            --btn-theme-text: #e8eaed;
            --card-hover: #303134;
        }

        [data-theme="light"] {
            --bg-container: #ffffff;
            --text-main: #202124;
            --border-color: #dadce0;
            --btn-theme-bg: #ffffff;
            --btn-theme-text: #202124;
            --card-hover: #f8f9fa;
        }

        body {
            background-color: #F37021; 
            color: var(--text-main);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 95vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            box-sizing: border-box;
        }

        /* Botão de Tema */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--btn-theme-bg);
            color: var(--btn-theme-text);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .theme-toggle:hover {
            transform: scale(1.05);
        }

        /* Logo Centralizada */
        .logo-container {
            margin: 40px 0 50px 0;
            text-align: center;
            width: 100%;
        }
        .logo-img {
            max-width: 350px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            transition: transform 0.3s ease;
        }
        .logo-img:hover {
            transform: scale(1.03);
        }

        /* Grid de Ferramentas */
        .tools-grid {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1000px;
            width: 100%;
            flex: 1;
        }

        /* Cartões (Quadrados Clicáveis) */
        .tool-card {
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            width: 320px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .tool-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 32px rgba(0,0,0,0.6);
            background-color: var(--card-hover);
        }

        /* Miniatura da Página */
        .card-thumb {
            width: 100%;
            height: 200px;
            background-color: #e8eaed; /* Cor de fundo caso a imagem demore a carregar */
            border-bottom: 2px solid var(--border-color);
            overflow: hidden;
            position: relative;
        }
        
        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Preenche o quadrado mantendo a proporção */
            object-position: top; /* Foca no topo da página capturada */
            transition: transform 0.4s ease;
        }

        .tool-card:hover .card-thumb img {
            transform: scale(1.05); /* Efeito de zoom leve ao passar o mouse */
        }

        /* Título do Cartão */
        .card-title {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
        }

        /* Rodapé */
        .footer {
            margin-top: 50px;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
        }
        .footer p {
            margin: 5px 0;
        }
        .footer a {
            color: #ffffff;
            font-weight: bold;
            text-decoration: underline;
        }
        .footer a:hover {
            color: #333333;
        }

        @media (max-width: 768px) {
            .tools-grid {
                gap: 25px;
            }
            .tool-card {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>
<body>

    <button id="themeToggleBtn" class="theme-toggle">☀️ Modo Claro</button>

    <div class="logo-container">
        <img src="img/logoestoquetools.png" alt="Logo EstoqueTools" class="logo-img">
    </div>

    <div class="tools-grid">
        <a href="https://estoquetools.netlify.app/conferencia" class="tool-card">
            <div class="card-thumb">
                <img src="img/thumb-conferencia.png" alt="Miniatura Conferência de Transações">
            </div>
            <div class="card-title">
                Conferência de Transações
            </div>
        </a>

        <a href="https://estoquetools.netlify.app/extratordeimagens" class="tool-card">
            <div class="card-thumb">
                <img src="img/thumb-extrator.png" alt="Miniatura Extrator Inteligente de Imagens">
            </div>
            <div class="card-title">
                Extrator Inteligente de Imagens
            </div>
        </a>
    </div>

    <div class="footer">
        <p>&copy; 2026 estoquetools. Todos os direitos reservados. Criado por Ronaldo Melo</p>
        <p>Atenção: qualquer problema com o sistema por favor entrar em contato através do e-mail <a href="mailto:ronaldo.melo@grupobrisanet.com.br">ronaldo.melo@grupobrisanet.com.br</a></p>
    </div>

    <script>
        // Sincronização do tema Dark/Light integrada com as outras páginas
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('themeBrisanet') || 'dark';
        
        document.documentElement.setAttribute('data-theme', savedTheme);
        atualizarBotaoTema(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('themeBrisanet', newTheme);
            atualizarBotaoTema(newTheme);
        });

        function atualizarBotaoTema(theme) {
            if (theme === 'light') {
                themeToggleBtn.innerHTML = '🌙 Modo Escuro';
            } else {
                themeToggleBtn.innerHTML = '☀️ Modo Claro';
            }
        }
    </script>
</body>
</html>
