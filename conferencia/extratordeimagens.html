<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Texto com Tema</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <link rel="icon" type="img/png" href="favicon.png">
    <link rel="shortcut icon" type="img/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        /* Variáveis de cores para facilitar o tema escuro */
        :root {
            --bg-color: #F37021; /* Fundo Laranja exato */
            --text-color: #333;
            --container-bg: #fff;
            --input-border: #ccc;
            --item-bg: #f1f1f1;
        }

        /* Cores do Modo Escuro */
        body.dark-mode {
            /* O fundo permanece laranja, alteramos apenas os elementos internos */
            --text-color: #e0e0e0;
            --container-bg: #2d2d2d;
            --input-border: #555;
            --item-bg: #3d3d3d;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px 20px 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Botão de Tema no canto superior direito */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        body.dark-mode .theme-toggle {
            background-color: #fff;
            color: #F37021; /* Texto laranja no botão branco no modo escuro */
        }

        h2 { text-align: center; color: #fff; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
        
        .main-wrapper {
            width: 100%;
            max-width: 600px;
            flex-grow: 1; /* Permite que o conteúdo empurre o rodapé para baixo */
        }

        .upload-container, .result-container {
            background: var(--container-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }

        select, input[type="file"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid var(--input-border);
            background-color: var(--container-bg);
            color: var(--text-color);
        }

        img {
            max-width: 100%;
            border-radius: 5px;
            border: 1px solid var(--input-border);
        }

        button.action-btn {
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button.action-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            color: #666;
        }

        #status { font-weight: bold; color: #000; text-align: center; }
        body.dark-mode #status { color: #fff; }

        ul { list-style-type: square; padding-left: 20px; }
        li { 
            margin-bottom: 5px; 
            padding: 8px; 
            background: var(--item-bg); 
            border-radius: 4px; 
            transition: background-color 0.3s;
        }

        /* Estilos do Rodapé */
        footer {
            text-align: center;
            color: #fff;
            margin-top: 40px;
            font-size: 13px;
            line-height: 1.5;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        footer a {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
        }
        footer a:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <button id="themeToggle" class="theme-toggle">🌙 Modo Escuro</button>

    <div class="main-wrapper">
        <h2>Extrator Inteligente de Imagem</h2>

        <div class="upload-container">
            <label for="imageInput"><strong>1. Faça o upload da imagem:</strong></label>
            <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
            
            <label for="filterSelect"><strong>2. O que você quer extrair?</strong></label>
            <select id="filterSelect">
                <option value="tudo">Extrair Tudo (Linha por Linha)</option>
                <option value="numeros">Extrair Apenas Números</option>
                <option value="letras">Extrair Apenas Palavras/Textos</option>
            </select>

            <img id="imagePreview" style="display:none;" alt="Preview da Imagem">
            
            <button id="extractBtn" class="action-btn" style="display:none;">Extrair e Gerar Lista</button>
            <p id="status"></p>
        </div>

        <div class="result-container" id="resultContainer" style="display:none;">
            <h3>Lista Gerada:</h3>
            <ul id="outputList"></ul>
        </div>
    </div>

    <footer>
        <p>© 2026 Extrator Inteligente de Imagem. Todos os direitos reservados. Criado por Ronaldo Melo</p>
        <p>Atenção: qualquer problema com o sistema por favor entrar em contato através do e-mail <a href="mailto:ronaldo.melo@grupobrisanet.com.br">ronaldo.melo@grupobrisanet.com.br</a></p>
    </footer>

    <script>
        // Lógica do Tema (Claro / Escuro)
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            
            if (document.body.classList.contains('dark-mode')) {
                themeToggle.innerText = '☀️ Modo Claro';
            } else {
                themeToggle.innerText = '🌙 Modo Escuro';
            }
        });

        // Lógica de Extração de Texto
        const imageInput = document.getElementById('imageInput');
        const filterSelect = document.getElementById('filterSelect');
        const imagePreview = document.getElementById('imagePreview');
        const extractBtn = document.getElementById('extractBtn');
        const statusText = document.getElementById('status');
        const outputList = document.getElementById('outputList');
        const resultContainer = document.getElementById('resultContainer');

        imageInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    extractBtn.style.display = 'block';
                    statusText.innerText = '';
                    outputList.innerHTML = '';
                    resultContainer.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        extractBtn.addEventListener('click', async function() {
            extractBtn.disabled = true;
            statusText.innerText = 'Lendo a imagem... Aguarde.';

            try {
                const result = await Tesseract.recognize(
                    imagePreview.src,
                    'por',
                    { logger: m => console.log(m) }
                );

                const textoExtraido = result.data.text;
                const filtro = filterSelect.value;
                let itensParaLista = [];

                if (filtro === 'numeros') {
                    itensParaLista = textoExtraido.match(/\d+/g) || [];
                } 
                else if (filtro === 'letras') {
                    itensParaLista = textoExtraido.match(/[A-Za-zÀ-ÿ]+/g) || [];
                } 
                else {
                    itensParaLista = textoExtraido.split('\n').filter(linha => linha.trim() !== '');
                }

                outputList.innerHTML = '';

                if (itensParaLista.length > 0) {
                    itensParaLista.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = item.trim();
                        outputList.appendChild(li);
                    });
                    resultContainer.style.display = 'flex';
                    statusText.innerText = 'Lista gerada com sucesso!';
                } else {
                    statusText.innerText = 'Nenhum item correspondente ao filtro foi encontrado na imagem.';
                }

            } catch (error) {
                console.error(error);
                statusText.innerText = 'Erro ao processar a imagem.';
                statusText.style.color = 'red';
            } finally {
                extractBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
